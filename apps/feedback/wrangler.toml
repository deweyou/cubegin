name = "cubegin-feedback"
main = "worker.mjs"
compatibility_date = "2026-11-23"

[dev]
port = 4490

[vars]
FEEDBACK_ORIGINS = "http://127.0.0.1:4489,http://localhost:4489"
FEEDBACK_FROM = "feedback@example.com"
FEEDBACK_TO = "inbox@example.com"

[[send_email]]
name = "EMAIL"
destination_address = "inbox@example.com"

[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "DELIVERY_LIMIT"
class_name = "FeedbackDeliveryLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackDeliveryLimit"]
