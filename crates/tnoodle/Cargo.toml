[package]
name = "cubegin-tnoodle"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "Cubegin maintained TNoodle Rust backend"

[lib]
name = "tnoodle_backend"
test = false
doctest = false

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
libm = "0.2.16"
rayon = { version = "1.12.0", optional = true }
sha1 = "0.11.0"
thiserror.workspace = true
web-time = "1.1"
