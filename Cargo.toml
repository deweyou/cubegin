[workspace]
resolver = "2"
members = ["crates/*", "bindings/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/deweyou/cubegin"

[workspace.dependencies]
cubegin-puzzle = { path = "crates/puzzle", version = "0.1.0" }
cubegin-solver = { path = "crates/solver", version = "0.1.0" }
cubegin-scramble = { path = "crates/scramble", version = "0.1.0" }
cubegin-diagram = { path = "crates/diagram", version = "0.1.0" }
cubegin-playback = { path = "crates/playback", version = "0.1.0" }
cubegin = { path = "crates/cubegin", version = "0.1.0" }
tnoodle-backend = { package = "cubegin-tnoodle", path = "crates/tnoodle", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.8"
rand_chacha = "0.3"
uniffi = "=0.32.2"
wasm-bindgen = "=0.2.126"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
