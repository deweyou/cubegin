name: Apple SDK and iOS checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple.yml'
      - 'scripts/test-ios-simulator.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - '!crates/**/*.md'
      - '!crates/**/docs/**'
      - '!crates/*/tests/**'
      - '!crates/*/examples/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'bindings/native/**'
      - '!bindings/native/**/*.md'
      - '!bindings/native/**/docs/**'
      - 'scripts/build-native.mjs'
      - 'scripts/process.mjs'
      - 'scripts/artifact-metadata.mjs'
      - 'fixtures/states.json'
      - 'fixtures/events.json'
      - 'Package.swift'
      - '.swiftlint.yml'
      - 'sdk/swift/**'
      - '!sdk/swift/**/*.md'
      - '!sdk/swift/**/docs/**'
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '!apps/ios/**/docs/**'
      - '!apps/ios/Design/**'
      - '!apps/ios/scripts/**'
      - '!apps/ios/.gitignore'
      - '!apps/ios/CubeginPreview.xcodeproj/**'
      - 'apps/ios/Cubegin/PrivacyPolicy.md'
      - 'apps/ios/scripts/copy-telemetry-config.sh'
      - 'scripts/build-ios.mjs'
      - 'scripts/package-ios.mjs'
      - 'scripts/verify-swift-package.mjs'
      - 'scripts/test-swift.mjs'
  pull_request:
    paths:
      - '.github/workflows/apple.yml'
      - 'scripts/test-ios-simulator.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - '!crates/**/*.md'
      - '!crates/**/docs/**'
      - '!crates/*/tests/**'
      - '!crates/*/examples/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'bindings/native/**'
      - '!bindings/native/**/*.md'
      - '!bindings/native/**/docs/**'
      - 'scripts/build-native.mjs'
      - 'scripts/process.mjs'
      - 'scripts/artifact-metadata.mjs'
      - 'fixtures/states.json'
      - 'fixtures/events.json'
      - 'Package.swift'
      - '.swiftlint.yml'
      - 'sdk/swift/**'
      - '!sdk/swift/**/*.md'
      - '!sdk/swift/**/docs/**'
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '!apps/ios/**/docs/**'
      - '!apps/ios/Design/**'
      - '!apps/ios/scripts/**'
      - '!apps/ios/.gitignore'
      - '!apps/ios/CubeginPreview.xcodeproj/**'
      - 'apps/ios/Cubegin/PrivacyPolicy.md'
      - 'apps/ios/scripts/copy-telemetry-config.sh'
      - 'scripts/build-ios.mjs'
      - 'scripts/package-ios.mjs'
      - 'scripts/verify-swift-package.mjs'
      - 'scripts/test-swift.mjs'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  apple_build:
    name: Apple SDK build
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint hand-written Swift
        run: |
          lint_dir="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$lint_dir/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $lint_dir/swiftlint.zip" | shasum -a 256 -c
          unzip -q "$lint_dir/swiftlint.zip" -d "$lint_dir"
          "$lint_dir/swiftlint" lint --strict --quiet
      - name: Build XCFramework and generated bindings
        run: node scripts/build-ios.mjs --app-only
      - name: Generated Swift binding fixture and replay tests
        run: node scripts/test-swift.mjs
      - name: Verify committed Swift bindings match Rust
        run: git diff --exit-code -- sdk/swift/Generated/
      - name: Archive matching framework and bindings
        run: tar -cf apple-build-input.tar dist/CubeginFFI.xcframework sdk/swift/Generated
      - uses: actions/upload-artifact@v4
        with:
          name: apple-build-input
          path: apple-build-input.tar
          if-no-files-found: error
          retention-days: 14

  apple_package:
    needs: apple_build
    name: Apple SDK package and isolated consumers
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: apple-build-input
      - run: tar -xf apple-build-input.tar
      - run: node scripts/build-ios.mjs --package-only
      - uses: actions/upload-artifact@v4
        with:
          name: apple-candidate
          path: |
            dist/CubeginFFI.xcframework.zip
            dist/CubeginFFI.xcframework.zip.sha256
            dist/swift-verification.json
            dist/xcframework-SDK.json
            dist/CubeginSDK-*.zip
            dist/CubeginSDK-*.zip.sha256
            Package.swift
            sdk/swift/Generated/
            sdk/swift/PackageTests/
          if-no-files-found: error
          retention-days: 14

  ios_release:
    needs: apple_build
    name: iOS App (release)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-build-input
      - run: tar -xf apple-build-input.tar
      - name: Build Release app for iOS
        working-directory: apps/ios
        run: |
          xcodebuild -project Cubegin.xcodeproj -scheme CubeginApp \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath DerivedData/release CODE_SIGNING_ALLOWED=NO build

  ios_simulator_build:
    needs: apple_build
    name: iOS Simulator test build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-build-input
      - run: tar -xf apple-build-input.tar
      - name: Build App and tests
        working-directory: apps/ios
        run: |
          xcodebuild -project Cubegin.xcodeproj -scheme CubeginApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/app-tests ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build-for-testing
      - name: Archive simulator test products
        working-directory: apps/ios/DerivedData/app-tests/Build/Products
        run: |
          tar -czf "$GITHUB_WORKSPACE/ios-simulator-test-products.tar.gz" ./*.xctestrun \
            Debug-iphonesimulator/cubegin.app Debug-iphonesimulator/CubeginUITests-Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-products
          path: ios-simulator-test-products.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  ios_simulator_tests:
    needs: ios_simulator_build
    name: iOS App (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [simulator-a, simulator-b]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-test-products
      - name: Extract simulator test products
        run: |
          mkdir -p apps/ios/DerivedData/test-products
          tar -xzf ios-simulator-test-products.tar.gz -C apps/ios/DerivedData/test-products
      - name: Prepare iPhone simulator
        id: simulator
        run: |
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-26-2
          device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          if ! xcrun simctl list runtimes --json | jq -e --arg runtime "$runtime" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable)' >/dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.2 -architectureVariant arm64
          fi
          simulator=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" --arg type "$device_type" \
            'first(.devices[$runtime][]? | select(.deviceTypeIdentifier == $type) | .udid) // empty')
          if [[ -z "$simulator" ]]; then
            simulator=$(xcrun simctl create 'Cubegin iPhone 17 Pro' "$device_type" "$runtime")
          fi
          xcrun simctl bootstatus "$simulator" -b
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
      - name: Run assigned App tests
        working-directory: apps/ios
        env:
          SHARD: ${{ matrix.shard }}
          SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          shopt -s nullglob
          plans=(DerivedData/test-products/*.xctestrun)
          if [[ "${#plans[@]}" != 1 ]]; then
            echo 'Expected exactly one .xctestrun in the simulator test products' >&2
            exit 1
          fi
          bash ../../scripts/test-ios-simulator.sh "$SHARD" \
            -xctestrun "${plans[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath "DerivedData/AppTests-$SHARD.xcresult"
      - name: Upload App test results
        if: ${{ !cancelled() && hashFiles(format('apps/ios/DerivedData/AppTests-{0}.xcresult/Info.plist', matrix.shard)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results-${{ matrix.shard }}
          path: apps/ios/DerivedData/AppTests-${{ matrix.shard }}.xcresult
          retention-days: 14
