name: Capability checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting, lint and workspace unit tests
        run: cargo xtask check
      - name: Full 4x4 and FTO solver replay
        run: cargo test --release -p cubegin-solver --locked -- --ignored
      - name: CLI release build
        run: cargo build --release -p cubegin-cli --locked
      - name: Build and verify all Rust crate archives
        run: cargo xtask verify-rust-packages
      - name: Verify package versions without publishing
        run: |
          version="$(node -p "require('./sdk/web/package.json').version")"
          cargo xtask release --version "$version" --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: rust-candidate
          path: |
            dist/rust/
            dist/release-plan.json
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web unit tests, E2E and build
    # Keep Darwin screenshot baselines on macOS / arm64.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build WASM and verify isolated npm consumer
        run: cargo xtask verify-packages
      - name: Type checks and actual WASM unit tests
        run: |
          pnpm check
          pnpm test
      - run: pnpm exec playwright install chromium
      - name: Browser E2E and screenshot comparisons
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: web-candidate
          path: |
            dist/*.tgz
            dist/npm-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  swift:
    name: Swift tests and iOS build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build XCFramework and verify isolated SwiftPM consumer
        run: cargo xtask build-sdk ios
      - name: Generated Swift binding fixture and replay tests
        run: node scripts/test-swift.mjs
      - name: Verify committed Swift bindings match Rust
        run: git diff --exit-code -- sdk/swift/Generated/
      - uses: actions/upload-artifact@v4
        with:
          name: apple-candidate
          path: |
            dist/CubeginFFI.xcframework.zip
            dist/CubeginFFI.xcframework.zip.sha256
            dist/swift-verification.json
            Package.swift
            sdk/swift/Generated/
            sdk/swift/PackageTests/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Kotlin tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build AAR, run Kotlin unit tests and verify isolated Maven consumer
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo xtask build-sdk android
      - uses: actions/upload-artifact@v4
        with:
          name: android-candidate
          path: |
            dist/android/
            dist/maven/
            dist/android-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-failure
          path: |
            sdk/android/library/build/reports/tests/
            sdk/android/library/build/test-results/
            examples/android/build/reports/tests/
            examples/android/build/test-results/
          retention-days: 14

  ci:
    name: CI passed
    if: always()
    needs: [rust, web, swift, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
      SWIFT_RESULT: ${{ needs.swift.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - name: Require every test and build job to succeed
        run: |
          for result in "$RUST_RESULT" "$WEB_RESULT" "$SWIFT_RESULT" "$ANDROID_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required test/build job failed, was cancelled or was skipped."
              exit 1
            fi
          done
