name: Cubegin checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          checks="$(node scripts/ci-scope.mjs "$BASE_SHA")"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "Selected checks: $checks"

  ci_rules:
    name: CI rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/ci-rules.test.mjs
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/check.yml

  docs:
    needs: scope
    if: startsWith(needs.scope.outputs.checks, 'docs')
    name: Documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/ci-docs.mjs "$BASE_SHA"

  rust:
    needs: scope
    if: needs.scope.outputs.checks == 'full'
    name: Rust lint, unit tests and solver replay
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatting, lint and workspace unit tests
        run: cargo xtask check
      - name: Full 4x4 and FTO solver replay
        run: cargo test --release -p cubegin-solver --locked -- --ignored
  rust_packages:
    needs: scope
    if: needs.scope.outputs.checks == 'full'
    name: Rust packages and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: CLI release build
        run: cargo xtask build-sdk cli
      - name: Build and verify all Rust crate archives
        run: cargo xtask verify-rust-packages
      - name: Verify package versions without publishing
        run: |
          version="$(node -p "require('./sdk/web/package.json').version")"
          cargo xtask release --version "$version" --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: rust-candidate
          path: |
            dist/rust/
            dist/release-plan.json
            dist/cli/
          if-no-files-found: error
          retention-days: 14

  web:
    needs: scope
    if: needs.scope.outputs.checks == 'full' || needs.scope.outputs.checks == 'docs-web'
    name: Web SDK build, unit and package tests
    # Keep Darwin screenshot baselines on macOS / arm64.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build WASM and verify isolated npm consumer
        run: cargo xtask verify-packages
      - name: Type checks and actual WASM unit tests
        if: needs.scope.outputs.checks == 'full'
        run: |
          pnpm check
          pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: web-candidate
          path: |
            dist/*.tgz
            dist/npm-verification.json
            dist/npm-SDK.json
            dist/*.tgz.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.checks == 'full'
        with:
          name: web-e2e-input
          path: |
            sdk/web/wasm/
            sdk/web/dist/
          if-no-files-found: error
          retention-days: 1

  web_e2e:
    needs: [scope, web]
    if: needs.scope.outputs.checks == 'full'
    name: Web browser E2E
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-e2e-input
          path: sdk/web
      - run: pnpm exec playwright install chromium
      - name: Browser E2E and screenshot comparisons
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  apple_build:
    needs: scope
    if: needs.scope.outputs.checks == 'full' || needs.scope.outputs.checks == 'ios'
    name: Apple SDK build
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build XCFramework and generated bindings
        run: node scripts/build-ios.mjs --app-only
      - name: Generated Swift binding fixture and replay tests
        if: needs.scope.outputs.checks == 'full'
        run: node scripts/test-swift.mjs
      - name: Verify committed Swift bindings match Rust
        if: needs.scope.outputs.checks == 'full'
        run: git diff --exit-code -- sdk/swift/Generated/
      - name: Archive matching framework and bindings
        run: tar -cf apple-build-input.tar dist/CubeginFFI.xcframework sdk/swift/Generated
      - uses: actions/upload-artifact@v4
        with:
          name: apple-build-input
          path: apple-build-input.tar
          if-no-files-found: error
          retention-days: 14

  apple_package:
    needs: [scope, apple_build]
    if: needs.scope.outputs.checks == 'full'
    name: Apple SDK package and isolated consumers
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: apple-build-input
      - run: tar -xf apple-build-input.tar
      - run: node scripts/build-ios.mjs --package-only
      - uses: actions/upload-artifact@v4
        with:
          name: apple-candidate
          path: |
            dist/CubeginFFI.xcframework.zip
            dist/CubeginFFI.xcframework.zip.sha256
            dist/swift-verification.json
            dist/xcframework-SDK.json
            dist/CubeginSDK-*.zip
            dist/CubeginSDK-*.zip.sha256
            Package.swift
            sdk/swift/Generated/
            sdk/swift/PackageTests/
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: apple_build
    name: iOS App (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [release, simulator-tests]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-build-input
      - run: tar -xf apple-build-input.tar
      - name: Build Release app for iOS
        if: matrix.check == 'release'
        working-directory: apps/ios
        run: |
          xcodebuild -project Cubegin.xcodeproj -scheme CubeginApp \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath DerivedData/release CODE_SIGNING_ALLOWED=NO build
      - name: Run App unit and UI tests
        if: matrix.check == 'simulator-tests'
        working-directory: apps/ios
        run: |
          xcodebuild -project Cubegin.xcodeproj -scheme CubeginApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath DerivedData/app-tests \
            -resultBundlePath DerivedData/AppTests.xcresult \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Upload App test results
        if: ${{ !cancelled() && matrix.check == 'simulator-tests' && hashFiles('apps/ios/DerivedData/AppTests.xcresult/Info.plist') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: apps/ios/DerivedData/AppTests.xcresult
          retention-days: 14

  android:
    needs: scope
    if: needs.scope.outputs.checks == 'full'
    name: Kotlin tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The retired SDK "tools" package is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build AAR, run Kotlin unit tests and verify isolated Maven consumer
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo xtask build-sdk android
      - uses: actions/upload-artifact@v4
        with:
          name: android-candidate
          path: |
            dist/android/
            dist/maven/
            dist/android-verification.json
            dist/android-SDK.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-failure
          path: |
            sdk/android/library/build/reports/tests/
            sdk/android/library/build/test-results/
            examples/android/build/reports/tests/
            examples/android/build/test-results/
          retention-days: 14

  ci:
    name: CI passed
    if: always()
    needs: [scope, ci_rules, docs, rust, rust_packages, web, web_e2e, apple_build, apple_package, ios, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      CHECKS: ${{ needs.scope.outputs.checks }}
      CI_RULES_RESULT: ${{ needs.ci_rules.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
      RUST_PACKAGES_RESULT: ${{ needs.rust_packages.result }}
      WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
      APPLE_BUILD_RESULT: ${{ needs.apple_build.result }}
      APPLE_PACKAGE_RESULT: ${{ needs.apple_package.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected jobs to succeed
        run: bash scripts/ci-gate.sh
